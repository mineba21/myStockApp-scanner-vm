# HTTP is retained only for ACME renewal; the MCP itself is HTTPS-only.
server {
    listen 80;
    listen [::]:80;
    server_name portfolio.161-33-212-161.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / { return 404; }
}
