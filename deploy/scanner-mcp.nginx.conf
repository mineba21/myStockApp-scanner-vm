# Include inside the existing TLS server for 161.33.212.161 only.
# OAuth query strings and authorization codes must not enter access logs.
location ~ ^/(mcp/?|authorize|token|register|revoke|consent|\.well-known/oauth-authorization-server|\.well-known/oauth-protected-resource/mcp)$ {
    client_max_body_size 64k;
    limit_req zone=scanner_mcp burst=30 nodelay;
    limit_req_status 429;
    access_log off;
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 60s;
}
