# Dedicated TLS virtual host. The certificate must be provisioned first.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name portfolio.161-33-212-161.sslip.io;

    ssl_certificate /etc/letsencrypt/live/portfolio.161-33-212-161.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio.161-33-212-161.sslip.io/privkey.pem;
    location ~ ^/(mcp/?|authorize|token|register|revoke|consent|\.well-known/oauth-authorization-server/?|\.well-known/oauth-protected-resource(?:/mcp)?/?)$ {
        client_max_body_size 64k;
        limit_req zone=scanner_mcp burst=30 nodelay;
        limit_req_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / { return 404; }
}
