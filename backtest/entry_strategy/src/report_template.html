<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동매수 진입 백테스트</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e2e1dc;--accent:#2f5d8a;--pos:#2e7d4f;--neg:#b23a32;--warn:#a36a00;
--c1:#2f5d8a;--c2:#c2593f;--c3:#3d8b6e;--c4:#8a5ca8;--c5:#b08a1e;--c6:#5f7f91;--c7:#a8476f;--c8:#6b6b66;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--panel:#1e1e1c;--ink:#ecebe6;--mute:#a09f98;--line:#33332f;--accent:#7fb0de;--pos:#6cc191;--neg:#ec7b72;--warn:#e0a84a;
--c1:#7fb0de;--c2:#ec8f74;--c3:#6cc1a0;--c4:#bb98d6;--c5:#dcbb5a;--c6:#94b4c6;--c7:#e087ac;--c8:#a09f98;--chip:#2a2d31}}
:root[data-theme="dark"]{--bg:#151514;--panel:#1e1e1c;--ink:#ecebe6;--mute:#a09f98;--line:#33332f;--accent:#7fb0de;--pos:#6cc191;--neg:#ec7b72;--warn:#e0a84a;
--c1:#7fb0de;--c2:#ec8f74;--c3:#6cc1a0;--c4:#bb98d6;--c5:#dcbb5a;--c6:#94b4c6;--c7:#e087ac;--c8:#a09f98;--chip:#2a2d31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{padding:20px 16px 8px;max-width:1240px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:var(--mute)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav .in{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:var(--mute);padding:10px 10px;font:inherit;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1240px;margin:0 auto;padding:12px 16px 60px}section{display:none}section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin:12px 0}
h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:16px 0 6px}h4,h5{margin:12px 0 4px}
.mute{color:var(--mute)}.small{font-size:12px}.pos{color:var(--pos)}.neg{color:var(--neg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}.kpi b{display:block;font-size:20px}.kpi span{color:var(--mute);font-size:12px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-weight:700;font-size:13px}
.b-no{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}.b-need{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}.b-ok{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.tw{overflow-x:auto;margin:6px 0}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:5px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--mute);font-weight:600}td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left}tr.hl td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.bar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle;margin-left:4px}
.chart{width:100%;position:relative}.chart svg{width:100%;height:auto;display:block}.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;margin:6px 0}
.legend span{cursor:pointer;user-select:none}.legend span.off{opacity:.35}.legend i{display:inline-block;width:10px;height:3px;margin-right:4px;vertical-align:middle}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:3;white-space:nowrap}
.ctl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.ctl button,.ctl select{font:inherit;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
.ctl button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
ul.tight li{margin:3px 0}code{background:var(--chip);padding:1px 4px;border-radius:4px;font-size:12px}pre{background:var(--chip);padding:10px;border-radius:6px;overflow-x:auto;font-size:12px}
.note{border-left:3px solid var(--warn);padding:6px 10px;background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:0 6px 6px 0;margin:8px 0}
.theme{position:absolute;right:16px;top:20px}.theme button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:3px 8px;cursor:pointer}
header{position:relative}
@media (max-width:640px){h1{font-size:18px}.theme{position:static;margin-top:6px}}
</style>
</head>
<body>
<header>
<h1>account1 미국 Scanner 자동매수 — 진입 전략 백테스트</h1>
<p>매도 S01 Scanner Stop 고정 · 매수 조건만 비교 · RECONSTRUCTED 신호 (VERIFIED 0건) · 실주문·운영 DB·VM 변경 없음</p>
<div class="theme"><button id="themeBtn">테마 전환</button></div>
</header>
<nav><div class="in" id="tabs"></div></nav>
<main>
<section id="s-sum"></section>
<section id="s-eq"></section>
<section id="s-cmp"></section>
<section id="s-gq"></section>
<section id="s-type"></section>
<section id="s-topn"></section>
<section id="s-sens"></section>
<section id="s-time"></section>
<section id="s-rec"></section>
<section id="s-design"><div class="card"><h2>자동매수 ↔ S01 자동손절 연동 설계 (검토안, 코드 변경 없음)</h2><!--__DESIGN__--></div></section>
<section id="s-p7"></section>
<section id="s-p8"><div class="card"><h2>P8 자동매수 SHADOW 구현 Plan (검토안, 코드 변경 없음)</h2><!--__PLAN__--></div></section>
<section id="s-meth"></section>
</main>
<script>
const D=/*__DATA__*/null;
const $=s=>document.querySelector(s);
const TABS=[["s-sum","요약·판정"],["s-eq","자산·낙폭·Heat"],["s-cmp","기존 대비 비교"],["s-gq","Grade·Quality"],["s-type","유형·진입 조건"],["s-topn","Top-N·무작위"],["s-sens","위험·보유기간 민감도"],["s-time","진입 시점"],["s-rec","권장·금지 조건"],["s-p7","P7 위험 예산"],["s-p8","P8 SHADOW Plan"],["s-design","S01 연동 설계 v2"],["s-meth","방법·한계"]];
const tabs=$("#tabs");TABS.forEach(([id,l],i)=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>show(id);b.dataset.id=id;tabs.appendChild(b)});
function show(id){document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===id));try{localStorage.setItem("eb_tab",id)}catch(e){}}
let t0="s-sum";try{t0=localStorage.getItem("eb_tab")||t0}catch(e){}show(document.getElementById(t0)?t0:"s-sum");
$("#themeBtn").onclick=()=>{const r=document.documentElement;const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark";redraw()};

const pct=(v,d=1)=>v==null||isNaN(v)?"–":(v*100).toFixed(d)+"%";
const num=(v,d=2)=>v==null||isNaN(v)?"–":(+v).toFixed(d);
const int=v=>v==null||isNaN(v)?"–":Math.round(v).toLocaleString();
const sg=(v,f=pct)=>v==null||isNaN(v)?"–":`<span class="${v>0?"pos":v<0?"neg":""}">${f(v)}</span>`;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COLORS=["--c1","--c2","--c3","--c4","--c5","--c6","--c7","--c8"];
const NLAB=n=>n>=999?"ALL":"Top-"+n;
const POOL={F0:"Strict 전체",F1:"유형별 적격(F1)",HARD_EXCL:"명백 위험 제외"};
const MK={M0:"시장필터 없음",M1:"BULL만",M2:"SPY>MA50",M3:"폭>50%"};
const PROF={P_A:"$100k·1%·20%·Heat6%",P_B:"$50k·1%·20%·Heat6%",P_C:"$50k·0.5%·10%·Heat2%"};

function table(rows,cols,opt={}){
  let h="<div class='tw'><table><thead><tr>"+cols.map(c=>`<th class="${c.l?"l":""}">${c.t}</th>`).join("")+"</tr></thead><tbody>";
  rows.forEach(r=>{h+=`<tr class="${opt.hl&&opt.hl(r)?"hl":""}">`+cols.map(c=>`<td class="${c.l?"l":""}">${c.f?c.f(r[c.k],r):(r[c.k]??"–")}</td>`).join("")+"</tr>"});
  return h+"</tbody></table></div>";
}
function q(rows,flt){return rows.filter(r=>Object.entries(flt).every(([k,v])=>Array.isArray(v)?v.includes(r[k]):r[k]===v))}
function bar(v,max,neg){if(v==null||isNaN(v))return"";const w=Math.min(60,Math.abs(v)/max*60);return `<span class="bar" style="width:${w}px;background:${v<0?css("--neg"):css("--pos")}"></span>`}

// ── line chart ──
const charts=[];
function lineChart(host,list,opt){const i=charts.findIndex(c=>c[0]===host);if(i>=0)charts[i]=[host,list,opt];else charts.push([host,list,opt]);drawLine(host,list,opt)}
function redraw(){charts.forEach(([h,l,o])=>drawLine(h,l,o));hists.forEach(([h,v,m,o])=>drawHist(h,v,m,o))}
function drawLine(host,list,opt){
  host.innerHTML="";const W=900,H=opt.h||300,P={l:58,r:12,t:12,b:26};
  const vis=list.filter(s=>!s.off);
  let xs=[],ymin=Infinity,ymax=-Infinity;
  vis.forEach(s=>{s.ys.forEach((y,i)=>{if(y==null)return;ymin=Math.min(ymin,y);ymax=Math.max(ymax,y)})});
  if(opt.zero){ymin=Math.min(ymin,0);ymax=Math.max(ymax,0)}
  if(!isFinite(ymin)){ymin=0;ymax=1}if(ymin===ymax){ymax=ymin+1}
  const pad=(ymax-ymin)*.05;ymin-=pad;ymax+=pad;
  const N=D.dates.length,x=i=>P.l+(i/(N-1))*(W-P.l-P.r),y=v=>P.t+(1-(v-ymin)/(ymax-ymin))*(H-P.t-P.b);
  const ink=css("--mute"),line=css("--line");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  for(let k=0;k<=4;k++){const v=ymin+(ymax-ymin)*k/4;s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="${line}"/><text x="${P.l-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="${ink}">${opt.fmt(v)}</text>`}
  let lastYear="";D.dates.forEach((d,i)=>{const yr=d.slice(0,4);if(yr!==lastYear&&d>=D.dates[0]){lastYear=yr;s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${P.t}" y2="${H-P.b}" stroke="${line}" stroke-dasharray="2,3"/><text x="${x(i)+3}" y="${H-8}" font-size="11" fill="${ink}">${yr}</text>`}});
  vis.forEach(sr=>{let p="";sr.ys.forEach((v,j)=>{if(v==null)return;const i=sr.i0+j;p+=(p?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)});s+=`<path d="${p}" fill="none" stroke="${css(sr.c)}" stroke-width="${sr.w||1.6}" ${sr.dash?'stroke-dasharray="5,4"':""}/>`});
  s+=`<line id="xh" x1="0" x2="0" y1="${P.t}" y2="${H-P.b}" stroke="${ink}" stroke-width=".6" style="display:none"/></svg>`;
  const wrap=document.createElement("div");wrap.className="chart";wrap.innerHTML=s;const tip=document.createElement("div");tip.className="tip";wrap.appendChild(tip);
  const leg=document.createElement("div");leg.className="legend";
  list.forEach(sr=>{const sp=document.createElement("span");sp.className=sr.off?"off":"";sp.innerHTML=`<i style="background:${css(sr.c)}"></i>${sr.name}`;sp.onclick=()=>{sr.off=!sr.off;drawLine(host,list,opt)};leg.appendChild(sp)});
  host.appendChild(leg);host.appendChild(wrap);
  const svg=wrap.querySelector("svg"),xh=svg.querySelector("#xh");
  svg.addEventListener("mousemove",e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W;const i=Math.round((px-P.l)/(W-P.l-P.r)*(N-1));if(i<0||i>=N)return;
    xh.setAttribute("x1",x(i));xh.setAttribute("x2",x(i));xh.style.display="";
    let t=`<b>${D.dates[i]}</b>`;vis.forEach(sr=>{const v=sr.ys[i-sr.i0];if(v!=null)t+=`<br><i style="display:inline-block;width:8px;height:3px;background:${css(sr.c)}"></i> ${sr.name}: ${opt.fmt(v)}`});
    tip.innerHTML=t;tip.style.display="block";const tx=(e.clientX-r.left);tip.style.left=Math.min(tx+12,r.width-220)+"px";tip.style.top="10px"});
  svg.addEventListener("mouseleave",()=>{tip.style.display="none";xh.style.display="none"});
}
const hists=[];
function hist(host,vals,marks,opt={}){hists.push([host,vals,marks,opt]);drawHist(host,vals,marks,opt)}
function drawHist(host,vals,marks,opt){
  const W=420,H=150,P={l:8,r:8,t:10,b:24};vals=vals.filter(v=>v!=null);if(!vals.length){host.innerHTML="";return}
  let lo=Math.min(...vals,...marks.map(m=>m.v)),hi=Math.max(...vals,...marks.map(m=>m.v));if(lo===hi)hi=lo+1e-3;const B=30,w=(hi-lo)/B;const cnt=Array(B).fill(0);
  vals.forEach(v=>cnt[Math.min(B-1,Math.floor((v-lo)/w))]++);const mx=Math.max(...cnt);const x=v=>P.l+(v-lo)/(hi-lo)*(W-P.l-P.r);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;cnt.forEach((c,i)=>{const h=(c/mx)*(H-P.t-P.b);s+=`<rect x="${x(lo+i*w)+.5}" y="${H-P.b-h}" width="${Math.max(1,(W-P.l-P.r)/B-1)}" height="${h}" fill="${css("--c6")}" opacity=".55"/>`});
  marks.forEach((m,k)=>{s+=`<line x1="${x(m.v)}" x2="${x(m.v)}" y1="${P.t}" y2="${H-P.b}" stroke="${css(m.c)}" stroke-width="2"/><text x="${x(m.v)+3}" y="${P.t+10+k*12}" font-size="10.5" fill="${css(m.c)}">${m.l} ${pct(m.v)}</text>`});
  s+=`<text x="${P.l}" y="${H-6}" font-size="10.5" fill="${css("--mute")}">${pct(lo)}</text><text x="${W-P.r}" y="${H-6}" font-size="10.5" text-anchor="end" fill="${css("--mute")}">${pct(hi)}</text></svg>`;
  host.innerHTML=(opt.title?`<div class="small mute">${opt.title}</div>`:"")+s;
}
const S=D.summary, V=D.verdict, R=D.rec;
const sel=V.selected, base=V.baseline;
const statusBadge=st=>`<span class="badge ${st==="RECOMMENDED_FOR_SHADOW"?"b-ok":st==="NEED_MORE_DATA"?"b-need":"b-no"}">${st}</span>`;
const specLab=s=>`${POOL[s.pool]||s.pool} · ${MK[s.market]} · ${s.rank==="GRADE"?"Grade 순위":s.rank} · ${NLAB(s.topn)}`;
const MCOLS=[{k:"total_return",t:"수익률",f:v=>sg(v)},{k:"cagr",t:"CAGR",f:v=>sg(v)},{k:"mdd",t:"MDD",f:v=>pct(v)},{k:"profit_factor",t:"PF",f:v=>num(v)},{k:"stop_rate",t:"손절률",f:v=>pct(v,0)},{k:"trades",t:"거래",f:int},{k:"avg_R",t:"평균 R",f:v=>sg(v,x=>num(x))},{k:"pnl_per_risk",t:"손익/위험",f:v=>num(v)},{k:"capital_utilization",t:"자금활용",f:v=>pct(v,0)},{k:"opportunity_reduction",t:"기회감소",f:v=>pct(v,0)},{k:"max_consec_stops",t:"연속손절",f:int},{k:"heat_current_avg",t:"Heat평균",f:v=>pct(v,1)}];

// ── 요약 ──
(function(){
  const t=V.test, f=V.full, u=V.operational_unl_full, ph=R.posthoc_candidate;
  const ck=Object.entries(V.checks).map(([k,v])=>`<tr><td class="l">${({test_cagr_ge_baseline:"Test CAGR ≥ 기준선",test_pf_ge_baseline:"Test PF ≥ 기준선",test_mdd_within_tolerance:"Test MDD 악화 ≤ 2%p",random_percentile_test_ge_min:"무작위 대비 백분위 ≥ 75 (Test)",trades_per_year_ge_min:"연 거래 ≥ 20",years_better_ge_min:"6개 연도 중 4개 이상 우위",walk_forward_share_better:"Walk-forward 우위 창 ≥ 50%",operational_unl_cagr_gt:"운영형(UNL) CAGR > 0",operational_unl_pf_gt:"운영형 PF(미청산 포함) > 1",operational_unl_mdd_within_tolerance:"운영형 MDD 악화 ≤ 2%p"})[k]||k}</td><td class="l">${V.hard_checks.includes(k)?"필수":"보조"}</td><td>${v?'<span class="pos">통과</span>':'<span class="neg">미달</span>'}</td></tr>`).join("");
  const K7=D.p7&&D.p7.concl;
  $("#s-sum").innerHTML=(K7?`<div class="card"><h2>P7 추가 검증 후 판정 ${statusBadge(K7.verdict_maintained)} 유지 · B01 ${statusBadge("NEED_MORE_DATA")}</h2>
  <p>위험 예산 추가 검증(P7)은 판정을 뒤집기 위한 최적화가 아니라 구조 확인입니다. 결론: 운영형 S01에서 매수가 멈추는 원인은 <b>현재가 기준 Heat</b>이며(6년 ${K7.unl_current_heat_trades.join("~")}건), Entry Heat로 바꾸면 매수는 회복되지만 자금 포화·섹터 집중을 막는 별도 장치가 필요합니다. B01 순위는 같은 후보군 무작위보다 낫지 않았습니다. 자세한 내용은 <b>P7 위험 예산</b> 탭, SHADOW 구현 계획은 <b>P8 SHADOW Plan</b> 탭에 있습니다.</p></div>`:"")+`
  <div class="card"><h2>P0~P6 최종 판정 ${statusBadge(V.status)}</h2>
  <p>Validation(2024-08~2025-09)에서 사전 등록 후보 48개 중 선택된 규칙: <b>${specLab(sel)}</b> (P_C 보수 설정, 종가+1% 지정가, S01+60일).<br>
  Test(2025-09~2026-11) 1회 평가에서 기준선(Strict 전체 · Grade 순위 · 같은 Top-N)보다 CAGR·PF가 낮아 필수 기준을 통과하지 못했습니다.</p>
  <div class="grid">
   <div class="kpi"><span>Test 수익률 (선택 / 기준선)</span><b>${pct(t.selected.total_return)} / ${pct(t.baseline.total_return)}</b></div>
   <div class="kpi"><span>Test PF (선택 / 기준선)</span><b>${num(t.selected.profit_factor)} / ${num(t.baseline.profit_factor)}</b></div>
   <div class="kpi"><span>Test MDD (선택 / 기준선)</span><b>${pct(t.selected.mdd)} / ${pct(t.baseline.mdd)}</b></div>
   <div class="kpi"><span>무작위 대비 백분위 (Test / 전체)</span><b>${num(V.random_percentile_test,0)} / ${num(V.random_percentile_full,0)}</b></div>
   <div class="kpi"><span>연도별 우위 (6년 중)</span><b>${V.years_better}</b></div>
   <div class="kpi"><span>Bootstrap 개선 확률 (Test)</span><b>${pct(V.bootstrap_test_daily_diff_annualized.prob_positive,0)}</b></div>
  </div>
  <h3>채택 기준 점검 (사전 고정)</h3>${"<div class='tw'><table><thead><tr><th>기준</th><th class='l'>구분</th><th>결과</th></tr></thead><tbody>"+ck+"</tbody></table></div>"}
  </div>
  <div class="card"><h2>핵심 결론</h2><ol class="tight">
   <li><b>사전 등록한 선별 규칙은 채택하지 않습니다 (NOT_RECOMMENDED).</b> 필터·시장필터·점수제 48개 조합 어느 것도 Test에서 기준선과 무작위 선택을 안정적으로 이기지 못했고, 같은 조합도 N이나 구간이 바뀌면 무작위 대비 백분위가 1~97로 흔들렸습니다.</li>
   <li><b>Auto Buy Score는 도입 근거가 없습니다.</b> Train에서 고른 요소(SC1: 손절폭+, ATR%−, 52주 고가 근접+)와 단일 요소(SC3)는 Test 무작위 대비 백분위 12~23. 이론 방향 고정(SC2)도 일관되지 않았습니다.</li>
   <li><b>Grade A와 B, STRONG과 MODERATE는 신호 유형·시장 상태를 통제하면 차이가 없습니다</b> (A−B = −0.00R, STRONG−MODERATE = −0.02R, 90% CI 모두 0 포함). A가 좋아 보인 것은 Grade 점수에 들어 있는 <b>시장 BULL 가점</b> 때문입니다. Grade S는 전부 BREAKOUT이며 전체 기간 −0.12R이지만 Train에서는 +0.12R로 일관되지 않습니다(n=52).</li>
   <li><b>가장 일관된 신호 단위 요인은 시장 상태입니다.</b> 유형 통제 후 NEUTRAL −0.29R, CAUTION −0.72R (CI 0 미포함). 늦게 Strict를 통과한 신호(n=47, −0.36R), 피벗 아래 매수(n=33~39, −0.23R)도 전체·Train 모두 나빴습니다.</li>
   <li><b>손절폭 과대(>12%) 제외는 효과가 없습니다.</b> 12~15% 구간은 H60에서 평균 이상이고, 운영형(UNL)에서는 가장 좋았습니다. 반대로 손절폭 ≤7%는 손절률이 56~60%로 가장 나빴습니다. 15% 초과만 일관되게 나쁩니다(n=27).</li>
   <li><b>성과를 가장 크게 좌우한 것은 신호 선별이 아니라 위험 예산과 보유 구조입니다.</b> 위험 기반 수량(Heat 2~6%)에서 자금 활용률은 16~46%로, 고정 10%×10종목(86%)보다 훨씬 낮았습니다. P_C 설정에서는 Heat 2%가 거의 항상 차 있어서 Top-1/2/3 차이가 작았습니다.</li>
