<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exit Strategy Backtest</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f6f4; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#7d7c77;
  --accent:#2a78d6; --gain:#0a7f0a; --gain-bg:#e3f3e3; --loss:#c43333; --loss-bg:#fbe6e6;
  --warn:#9a6a00; --warn-bg:#fdf1d6; --info-bg:#e6effa;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --grid:#e7e6e1; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#33332f;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
    --accent:#3987e5; --gain:#3fc23f; --gain-bg:#16301a; --loss:#ef7272; --loss-bg:#3a1b1b;
    --warn:#e6b23a; --warn-bg:#352a10; --info-bg:#172537;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
    --grid:#2c2c29; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#33332f;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
  --accent:#3987e5; --gain:#3fc23f; --gain-bg:#16301a; --loss:#ef7272; --loss-bg:#3a1b1b;
  --warn:#e6b23a; --warn-bg:#352a10; --info-bg:#172537;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  --grid:#2c2c29; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 24px 0}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--text-2);font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--text-2);padding:9px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters label{font-size:12px;color:var(--text-2);display:flex;gap:6px;align-items:center}
select,.seg button{font:inherit;font-size:13px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.seg{display:inline-flex}
.seg button{border-radius:0;margin-left:-1px;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:20px 24px 60px;max-width:1440px;margin:0 auto}
section.tab{display:none}
section.tab.on{display:block}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:14px;margin:0 0 10px;color:var(--text)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--text-3);margin-top:2px}
.pos{color:var(--gain)} .neg{color:var(--loss)} .mut{color:var(--text-3)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.b-rec{background:var(--info-bg);color:var(--accent)}
.b-snap{background:var(--warn-bg);color:var(--warn)}
.b-port{background:var(--surface-2);color:var(--text-2)}
.b-ok{background:var(--gain-bg);color:var(--gain)}
.b-no{background:var(--loss-bg);color:var(--loss)}
.b-wait{background:var(--warn-bg);color:var(--warn)}
.note{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:10px 0}
.note b{color:var(--text)}
.tw{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);color:var(--text-2);font-weight:600;cursor:pointer;user-select:none}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th.sorted::after{content:" ▾";color:var(--accent)}
th.sorted.asc::after{content:" ▴"}
tr:hover td{background:var(--surface-2)}
td.hl{font-weight:650}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--text-3);font-size:11px}
.axis line,.axis path{stroke:var(--grid)}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:50;display:none;max-width:320px}
.tip .t{font-weight:600;margin-bottom:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-2);margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend span.off{opacity:.35}
.hm td{text-align:center;font-weight:600;min-width:56px}
.list{margin:0;padding-left:18px}
.list li{margin:3px 0}
.rule{border-left:3px solid var(--border);padding-left:12px;margin:8px 0}
.rule.ok{border-color:var(--gain)} .rule.no{border-color:var(--loss)} .rule.wait{border-color:var(--warn)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--text-2)}
.case-list button{display:block;width:100%;text-align:left;background:none;border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px;color:var(--text);font:inherit;font-size:12.5px;cursor:pointer}
.case-list button.on{border-color:var(--accent);background:var(--info-bg)}
.small{font-size:12px;color:var(--text-2)}
.toggle{margin-left:auto}
@media (max-width:720px){
  header,main,.filters{padding-left:16px;padding-right:16px}
  .g2{grid-template-columns:1fr}
  .kpi .v{font-size:20px}
}
</style>
</head>
<body>
<header>
  <h1>Stock Scanner — Exit Strategy Backtest Report</h1>
  <div class="sub" id="hdr-sub"></div>
  <nav id="tabs"></nav>
</header>
<div class="filters" id="filters">
  <label>시장 <span class="seg" id="f-market"></span></label>
  <label>신호 유형 <select id="f-type"><option value="ALL">전체</option><option>BREAKOUT</option><option>RE_BREAKOUT</option><option>REBOUND</option></select></label>
  <label>기간 <select id="f-period"><option value="full">전체</option><option value="last_1y">최근 1년</option><option value="last_6m">최근 6개월</option><option value="last_3m">최근 3개월</option></select></label>
  <label>평가 기간 <select id="f-h"><option value="20">20거래일</option><option value="60" selected>60거래일</option><option value="120">120거래일</option></select></label>
  <label>신호 그룹 <select id="f-group">
    <option value="B_strict">B. Strict 통과</option><option value="A_all">A. 전체 신호</option>
    <option value="C_gradeS">C. Grade S</option><option value="C_gradeA">C. Grade A</option><option value="D_gradeB">D. Grade B</option>
    <option value="E_strong">E. STRONG</option><option value="F_moderate">F. MODERATE</option>
    <option value="G_warn">G. 경고 있음</option><option value="G_nowarn">G. 경고 없음</option>
    <option value="SNAP_visible">스냅샷 (MCP 현재 행)</option></select></label>
  <label>전략 <select id="f-fam"><option value="CORE">핵심 비교군</option><option value="ALL">전체</option>
    <option>S02</option><option>S03</option><option>S04</option><option>S05</option><option>S06</option><option>S07</option><option>S07T</option><option>S08</option><option>S09</option></select></label>
  <button class="seg toggle" id="theme" style="padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer">테마</button>
</div>
<main id="main"></main>
<div class="tip" id="tip"></div>
<script>
const D = /*__DATA__*/null;
const CORE = ["S00","S01","S02_fix7","S03_scap7","S03_atr2cap7","S04B_t1_wall","S04A_t0_w5","S04F_upthrust","S05_ma50x2","S05_stage3","S06_a10_d8","S06_a10_atr3","S07_a10_d6_r50_trail_pct10","S07T_t10_r50_trail_pct10","S08_20d_lt2","S09A","S09B","S09A_OPT","S09B_OPT"];
const TABS = [["exec","01 Executive Summary"],["audit","02 Data Audit"],["cmp","03 Strategy Comparison"],["early","04 Early Exit"],["profit","05 Profit Protection"],["param","06 Parameter Analysis"],["case","07 Case Study"],["rec","08 Recommendation"]];
const S = {market:"US", type:"ALL", period:"full", h:60, group:"B_strict", fam:"CORE", tab:"exec", hidden:{}};
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(x,d=1,sign=true)=>x==null||isNaN(x)?"–":((sign&&x>0?"+":"")+(x*100).toFixed(d)+"%");
const num=(x,d=2)=>x==null||isNaN(x)?"–":(+x).toFixed(d);
const cls=x=>x==null?"":x>0?"pos":x<0?"neg":"";
const lab=s=>D.labels[s]||s;
const markets=()=>[...new Set(D.summary.map(r=>r.market))].sort().reverse();
function sv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
const SER=()=>[1,2,3,4,5,6,7,8].map(i=>sv("--s"+i));

/* ── tooltip ── */
const tip=$("#tip");
function showTip(e,html){tip.innerHTML=html;tip.style.display="block";const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=x+"px";tip.style.top=y+"px"}
function hideTip(){tip.style.display="none"}

/* ── sortable table ── */
function table(el, cols, rows, opt={}){
  let sortK=opt.sort||null, asc=opt.asc||false;
  function draw(){
    const rs=[...rows]; if(sortK){const c=cols.find(c=>c.k===sortK);rs.sort((a,b)=>{const va=c.v?c.v(a):a[sortK],vb=c.v?c.v(b):b[sortK];if(va==null)return 1;if(vb==null)return -1;return (va>vb?1:va<vb?-1:0)*(asc?1:-1)})}
    el.innerHTML=`<div class="tw"><table><thead><tr>${cols.map(c=>`<th data-k="${c.k}" class="${c.l?"l":""} ${sortK===c.k?"sorted"+(asc?" asc":""):""}" title="${esc(c.t||"")}">${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${
      rs.length?rs.map(r=>`<tr>${cols.map(c=>{const raw=c.v?c.v(r):r[c.k];const txt=c.f?c.f(raw,r):esc(raw??"–");const cc=c.c?c.c(raw,r):"";return `<td class="${c.l?"l":""} ${cc} ${opt.hl&&opt.hl(r)?"hl":""}">${txt}</td>`}).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}" class="mut l">해당 조건의 데이터 없음</td></tr>`}</tbody></table></div>`;
    el.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)asc=!asc;else{sortK=k;asc=false}draw()});
  }
  draw();
}
const P=(k,h,t)=>({k,h,t,f:v=>pct(v),c:v=>cls(v)});
const PN=(k,h,t)=>({k,h,t,f:v=>pct(v,1,false)});
const PL=(k,h,t)=>({k,h,t,f:v=>pct(v,1,false),c:v=>v>0?"neg":""});
const N=(k,h,d=2,t)=>({k,h,t,f:v=>num(v,d)});

/* ── charts ── */
function lineChart(el, series, opt={}){
  const W=el.clientWidth||800, H=opt.h||300, m={l:48,r:16,t:10,b:28};
  const vis=series.filter(s=>!S.hidden[s.name]);
  const all=vis.flatMap(s=>s.d.map((d,i)=>[new Date(d).getTime(), s.v[i]]));
  if(!all.length){el.innerHTML='<div class="mut small">데이터 없음</div>';return}
  const x0=Math.min(...all.map(a=>a[0])),x1=Math.max(...all.map(a=>a[0]));
  let y0=Math.min(...all.map(a=>a[1])),y1=Math.max(...all.map(a=>a[1]));const pad=(y1-y0)*.06||.05;y0-=pad;y1+=pad;
  const X=t=>m.l+(t-x0)/(x1-x0||1)*(W-m.l-m.r), Y=v=>m.t+(1-(v-y0)/(y1-y0||1))*(H-m.t-m.b);
  const ticks=5;let g="";
  for(let i=0;i<=ticks;i++){const v=y0+(y1-y0)*i/ticks;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${opt.fmt?opt.fmt(v):num(v,2)}</text>`}
  const yrs=[];for(let y=new Date(x0).getFullYear();y<=new Date(x1).getFullYear();y++)yrs.push(y);
  yrs.forEach(y=>{const t=new Date(y,0,1).getTime();if(t>=x0&&t<=x1)g+=`<text x="${X(t)}" y="${H-8}" text-anchor="middle">${y}</text>`});
  if(opt.base!=null&&opt.base>=y0&&opt.base<=y1)g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(opt.base)}" y2="${Y(opt.base)}" stroke="var(--text-3)" stroke-dasharray="3 3"/>`;
  const paths=vis.map(s=>`<path d="${s.d.map((d,i)=>(i?"L":"M")+X(new Date(d).getTime()).toFixed(1)+","+Y(s.v[i]).toFixed(1)).join("")}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="4 3"':""} stroke-linejoin="round"/>`).join("");
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><g class="axis">${g}</g>${paths}<line id="xh" y1="${m.t}" y2="${H-m.b}" stroke="var(--text-3)" stroke-width="1" visibility="hidden"/><rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent"/></svg>`;
  const svg=el.querySelector("svg"), xh=svg.querySelector("#xh");
  svg.querySelector("rect").onmousemove=e=>{const r=svg.getBoundingClientRect();const px=(e.clientX-r.left)*W/r.width;const t=x0+(px-m.l)/(W-m.l-m.r)*(x1-x0);
    xh.setAttribute("x1",px);xh.setAttribute("x2",px);xh.setAttribute("visibility","visible");
    let date="";const rows=vis.map(s=>{let bi=0,bd=1e18;s.d.forEach((d,i)=>{const dd=Math.abs(new Date(d).getTime()-t);if(dd<bd){bd=dd;bi=i}});date=s.d[bi];return `<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color}"></i> ${esc(s.name)}: <b>${opt.fmt?opt.fmt(s.v[bi]):num(s.v[bi],3)}</b></div>`}).join("");
    showTip(e,`<div class="t">${date}</div>${rows}`)};
  svg.querySelector("rect").onmouseleave=()=>{xh.setAttribute("visibility","hidden");hideTip()};
}
function legend(el, series, redraw){
  el.innerHTML=series.map(s=>`<span data-n="${esc(s.name)}" class="${S.hidden[s.name]?"off":""}"><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("");
  el.querySelectorAll("span").forEach(sp=>sp.onclick=()=>{S.hidden[sp.dataset.n]=!S.hidden[sp.dataset.n];redraw()});
}
function barChart(el, items, opt={}){
  // items: [{label, value, sub}] horizontal bars, diverging at 0
  if(!items.length){el.innerHTML='<div class="mut small">데이터 없음</div>';return}
  const W=el.clientWidth||600, rh=opt.rh||22, lw=opt.lw||Math.min(220,W*0.38), H=items.length*rh+24, r=W-12;
  const vals=items.map(i=>i.value).filter(v=>v!=null);const mn=Math.min(0,...vals),mx=Math.max(0,...vals);
  const X=v=>lw+(v-mn)/((mx-mn)||1)*(r-lw-60);
  let s=`<line x1="${X(0)}" x2="${X(0)}" y1="0" y2="${H-20}" stroke="var(--text-3)"/>`;
  items.forEach((it,i)=>{const y=i*rh+3, v=it.value??0, x=Math.min(X(0),X(v)), w=Math.abs(X(v)-X(0));const col=it.color||(v>=0?"var(--gain)":"var(--loss)");
    s+=`<text x="${lw-8}" y="${y+rh/2+1}" text-anchor="end" fill="var(--text-2)" font-size="11.5">${esc(it.label.length>34?it.label.slice(0,33)+"…":it.label)}</text>
    <rect class="bar" data-i="${i}" x="${x}" y="${y+3}" width="${Math.max(w,1)}" height="${rh-8}" rx="3" fill="${col}" opacity="${it.dim?0.45:0.9}"/>
    <text x="${v>=0?X(v)+5:X(0)+5}" y="${y+rh/2+1}" text-anchor="start" fill="var(--text)" font-size="11.5">${opt.fmt?opt.fmt(it.value):pct(it.value)}</text>
    <rect data-i="${i}" class="hit" x="0" y="${y}" width="${W}" height="${rh}" fill="transparent"/>`});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
  el.querySelectorAll(".hit").forEach(h=>{h.onmousemove=e=>{const it=items[+h.dataset.i];showTip(e,`<div class="t">${esc(it.label)}</div>${it.tip||pct(it.value)}`)};h.onmouseleave=hideTip});
}
function heat(el, rowsL, colsL, get, opt={}){
  // diverging around opt.mid (default 0): red(loss) ↔ green(gain); numbers printed in cells (색만으로 구분하지 않음)
  const vals=[];rowsL.forEach(r=>colsL.forEach(c=>{const v=get(r,c);if(v!=null)vals.push(v)}));
  const mid=opt.mid??0, ext=Math.max(...vals.map(v=>Math.abs(v-mid)),1e-9);
  const dark=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme: dark)").matches);
  const col=v=>{if(v==null)return "transparent";const t=Math.min(1,Math.abs(v-mid)/ext);const a=(0.12+0.6*t).toFixed(2);return v>=mid?(dark?`rgba(63,194,63,${a})`:`rgba(10,140,10,${a})`):(dark?`rgba(239,114,114,${a})`:`rgba(205,50,50,${a})`)};
  el.innerHTML=`<div class="tw"><table class="hm"><thead><tr><th class="l">${esc(opt.corner||"")}</th>${colsL.map(c=>`<th>${esc(opt.colFmt?opt.colFmt(c):c)}</th>`).join("")}</tr></thead><tbody>${rowsL.map(r=>`<tr><td class="l">${esc(opt.rowFmt?opt.rowFmt(r):r)}</td>${colsL.map(c=>{const v=get(r,c);return `<td style="background:${col(v)}" title="${esc((opt.rowFmt?opt.rowFmt(r):r)+" / "+(opt.colFmt?opt.colFmt(c):c))}">${v==null?"–":(opt.fmt?opt.fmt(v):pct(v))}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function candle(el, ch, ex){
  const W=el.clientWidth||900, H=380, VH=70, m={l:56,r:12,t:10,b:24}, n=ch.dates.length;
  const pr=[...ch.h,...ch.l,...(ch.ma21||[]),...(ch.ma50||[])].filter(v=>v!=null&&v>0);
  if(ex.pivot)pr.push(ex.pivot);if(ex.initial_stop)pr.push(ex.initial_stop);
  let y0=Math.min(...pr),y1=Math.max(...pr);const pd=(y1-y0)*.04;y0-=pd;y1+=pd;
  const bw=(W-m.l-m.r)/n, X=i=>m.l+bw*(i+.5), Y=v=>m.t+(1-(v-y0)/(y1-y0))*(H-VH-m.t-m.b-8);
  const vmax=Math.max(...ch.v), VY=v=>H-m.b-v/vmax*VH;
  let g="";
  for(let i=0;i<=5;i++){const v=y0+(y1-y0)*i/5;g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${v>=1000?Math.round(v).toLocaleString():v.toFixed(2)}</text>`}
  const step=Math.ceil(n/8);ch.dates.forEach((d,i)=>{if(i%step===0)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${d.slice(2)}</text>`});
  let c="";
  for(let i=0;i<n;i++){if(!(ch.o[i]>0))continue;const up=ch.c[i]>=ch.o[i];const col=up?"var(--gain)":"var(--loss)";
    c+=`<line x1="${X(i)}" x2="${X(i)}" y1="${Y(ch.h[i])}" y2="${Y(ch.l[i])}" stroke="${col}"/><rect x="${X(i)-bw*.35}" y="${Y(Math.max(ch.o[i],ch.c[i]))}" width="${bw*.7}" height="${Math.max(1,Math.abs(Y(ch.o[i])-Y(ch.c[i])))}" fill="${col}"/>
    <rect x="${X(i)-bw*.35}" y="${VY(ch.v[i])}" width="${bw*.7}" height="${H-m.b-VY(ch.v[i])}" fill="var(--text-3)" opacity=".35"/>`}
  const line=(arr,color,dash)=>{let p="";arr.forEach((v,i)=>{if(v!=null)p+=(p?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1)});return p?`<path d="${p}" fill="none" stroke="${color}" stroke-width="1.6" ${dash?`stroke-dasharray="${dash}"`:""}/>`:""};
  const idx=d=>ch.dates.indexOf(d);
  let ov=line(ch.ma21,"var(--s1)")+line(ch.ma50,"var(--s2)");
  if(ch.trail){const arr=ch.dates.map(d=>{const t=ch.trail.find(x=>x.date===d);return t?t.v:null});ov+=line(arr,"var(--s7)","4 3")}
  const hl=(v,color,txt)=>v?`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${color}" stroke-dasharray="5 4"/><text x="${W-m.r-2}" y="${Y(v)-4}" text-anchor="end" fill="${color}" font-size="11">${txt}</text>`:"";
  ov+=hl(ex.pivot,"var(--s4)","Pivot")+hl(ex.initial_stop,"var(--loss)","Initial stop");
  const mk=(i,price,color,txt,up)=>i<0?"":`<g><path d="M${X(i)},${Y(price)+(up?6:-6)} l-6,${up?10:-10} l12,0 z" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/><text x="${X(i)}" y="${Y(price)+(up?28:-20)}" text-anchor="middle" font-size="11" fill="var(--text)">${txt}</text></g>`;
  ov+=mk(idx(ex.entry_date),ex.entry_price,"var(--s1)","매수",true);
  (ex.fills||[]).forEach(f=>{const p=f.reason.startsWith("PARTIAL");ov+=mk(idx(f.date),f.price,p?"var(--s3)":"var(--loss)",p?"부분매도":"매도",false)});
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}"><g class="axis">${g}</g>${c}${ov}<rect id="hit" x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent"/></svg>`;
  const svg=el.querySelector("svg");
  svg.querySelector("#hit").onmousemove=e=>{const r=svg.getBoundingClientRect();const i=Math.max(0,Math.min(n-1,Math.floor(((e.clientX-r.left)*W/r.width-m.l)/bw)));
    showTip(e,`<div class="t">${ch.dates[i]}</div>시 ${num(ch.o[i])} 고 ${num(ch.h[i])}<br>저 ${num(ch.l[i])} 종 ${num(ch.c[i])}<br>MA21 ${num(ch.ma21[i])} · MA50 ${num(ch.ma50[i])}<br>거래량 ${Math.round(ch.v[i]).toLocaleString()}`)};
  svg.querySelector("#hit").onmouseleave=hideTip;
}

    return `<div class="card rule ${c}"><h3>${r.market} · ${r.signal_type} <span class="badge ${c==="ok"?"b-ok":c==="no"?"b-no":"b-wait"}">${esc(st)}</span></h3>
    ${r.selected_strategy?`<div class="small" style="margin-bottom:8px">선택: <b>${esc(r.selected_strategy)}</b> — ${esc(r.selected_label||lab(r.selected_strategy))}</div>
    <div class="kv"><div>초기 손절</div><div>${esc(r.initial_stop_method)}${r.max_loss_pct?` · 최대 손실 ${(r.max_loss_pct*100).toFixed(0)}%`:""}${r.atr_multiplier?` · ATR×${r.atr_multiplier}`:""}</div>
    <div>Breakout 실패</div><div>${esc(r.breakout_failure_mode)}${r.breakout_confirmation_days?` · ${r.breakout_confirmation_days}일 종가`:""}${r.pivot_tolerance_pct!=null&&r.breakout_failure_mode!=="NONE"?` · 허용 ${(r.pivot_tolerance_pct*100).toFixed(0)}%`:""}${r.breakout_volume_ratio?` · 거래량 ${r.breakout_volume_ratio}x`:""}${r.breakout_watch_window_days?` · ${r.breakout_watch_window_days}일 감시`:""}</div>
    <div>수익 보호</div><div>${r.profit_activation_pct!=null?`+${(r.profit_activation_pct*100).toFixed(0)}% 활성 → 고점 -${((r.trailing_drawdown_pct||0)*100).toFixed(0)}%`:"–"}${r.partial_sell_ratio?` · ${(r.partial_sell_ratio*100).toFixed(0)}% 부분매도 (${esc(r.partial_mode)})`:""}</div>
    <div>잔여 수량</div><div>${esc(r.remaining_exit_method||"–")}</div>
    <div>자동매도</div><div>${(r.auto_exit_rules||[]).map(x=>`<span class="badge b-rec">${esc(x)}</span>`).join(" ")}</div>
    <div>승인 요청 유지</div><div>${(r.review_exit_rules||[]).map(x=>`<span class="badge b-wait">${esc(x)}</span>`).join(" ")||"–"}</div>
    <div>표본</div><div>전체 ${r.sample_count?.all} · Validation ${r.sample_count?.validation} · Test ${r.sample_count?.test}</div>
    <div>Test 평균</div><div><span class="${cls(o.pick?.avg_return)}">${pct(o.pick?.avg_return,2)}</span> vs S01 <span class="${cls(o.S01_scanner_stop?.avg_return)}">${pct(o.S01_scanner_stop?.avg_return,2)}</span> vs 보유 <span class="${cls(o.S00_hold?.avg_return)}">${pct(o.S00_hold?.avg_return,2)}</span></div>
    <div>Test -10%↓</div><div>${pct(o.pick?.loss_10_rate,1,false)} vs S01 ${pct(o.S01_scanner_stop?.loss_10_rate,1,false)}</div>
    ${r.tradeoff_note?`<div>교환 관계</div><div style="white-space:normal">${esc(r.tradeoff_note)}</div>`:""}
    <div>Bootstrap</div><div>S01 대비 쌍대 차이 90% 구간 ${pct(r.robustness?.paired_vs_S01_bootstrap_full?.mean_p05,2)} ~ ${pct(r.robustness?.paired_vs_S01_bootstrap_full?.mean_p95,2)}</div></div>`:`<div class="small">${esc(r.note||"")}</div>`}</div>`};
  el.innerHTML=`<h2>Recommendation</h2>
  <div class="note"><b>${esc(D.rules.generated_note)}</b><br>상태 기준 — RECOMMENDED_FOR_PAPER: Validation·Test 모두 기존 Scanner stop(S01)보다 objective가 높고, Test의 -10% 이상 손실 비율이 S01 이하이며, 거래당 기대수익이 S01보다 0.5%p 넘게 낮지 않고, 전체 기간 S01 대비 쌍대 bootstrap 중앙값이 -0.5%p 이상이며, Test 표본이 30건 이상. NEED_MORE_DATA: 표본 부족 또는 결과가 엇갈림. NOT_RECOMMENDED: Test에서 S01보다 나쁨.</div>
  <h3>US</h3><div class="grid g2">${rules.filter(r=>r.market==="US").map(card).join("")}</div>
  <h3 style="margin-top:18px">KR</h3><div class="grid g2">${rules.filter(r=>r.market==="KR").map(card).join("")}</div>
  <h3 style="margin-top:18px">자동매도 / 승인 요청 구분 (공통 원칙)</h3><div class="card"><ul class="list">
   <li><b>자동매도 허용 권장</b>: P1 Hard Stop(Scanner stop과 최대 손실률 중 높은 가격), P2 Breakout 실패(종가 확인 → 다음 날 시가), P3 수익 보호 부분매도·잔여 trailing. 모두 가격만으로 결정되는 기계적 규칙이다.</li>
   <li><b>승인 요청 유지 권장</b>: P4 추세 악화(MA 이탈·Stage 전환), P5 시간 손절. S09-B(전부 매도 가정)는 사용자가 모든 REVIEW를 승인했다고 가정한 가상 결과이며, 실제 자동매도 성과가 아니다.</li>
   <li>기존 보유종목에는 신규 매도 기준을 소급 적용하지 않는다. 모의투자(paper)로 먼저 검증한다.</li></ul></div>
  <h3 style="margin-top:18px">성과 불확실성 및 제한사항</h3><div class="card"><ul class="list">
   <li>성과는 현재 스캐너 로직으로 재생성한 신호 기준이다. 당시 실제로 받았던 알림과 다를 수 있다 (로직 변경 이력, 운영 .env 미확인, 수정주가 재계산).</li>
   <li>현재 구성종목 유니버스 → 생존 편향이 있어 절대 수익률은 과대 추정될 수 있다. 전략 간 <b>상대 비교</b>가 주된 용도다.</li>
   <li>독립 신호 분석은 같은 종목의 보유 기간이 겹치는 거래를 포함한다. 불확실성은 block bootstrap으로 추정했다.</li>
   <li>MCP 스냅샷(${D.audit.snapshot.rows}행, 약 3개월)은 60·120일 평가 기간을 채우지 못한 신호가 많아 참고용으로만 썼다.</li></ul></div>`;
}

/* ── shell ── */
const RENDER={exec:tabExec,audit:tabAudit,cmp:tabCmp,early:tabEarly,profit:tabProfit,param:tabParam,case:tabCase,rec:tabRec};
function render(){
  const main=$("#main");main.innerHTML=`<section class="tab on" id="t-${S.tab}"></section>`;RENDER[S.tab]($("#t-"+S.tab));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  document.querySelectorAll("#f-market button").forEach(b=>b.classList.toggle("on",b.dataset.m===S.market));
  try{localStorage.setItem("exitbt",JSON.stringify({tab:S.tab,market:S.market}))}catch(e){}
}
function init(){
  try{Object.assign(S,JSON.parse(localStorage.getItem("exitbt")||"{}"))}catch(e){}
  if(!markets().includes(S.market))S.market=markets()[0];
  const a=D.audit.reconstructed||{};
  $("#hdr-sub").innerHTML=`생성 ${D.generated_at} · Replay ${D.config.replay_start} 이후 · 기본 평가 ${D.config.default_horizon}거래일 · 실제 주문 없음 · <span class="badge b-rec">RECONSTRUCTED</span> <span class="badge b-snap">SNAPSHOT_ONLY</span> <span class="badge b-port">PORTFOLIO</span>`;
  $("#tabs").innerHTML=TABS.map(([k,v])=>`<button data-t="${k}">${v}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
  $("#f-market").innerHTML=markets().map(m=>`<button data-m="${m}">${m}</button>`).join("");
  $("#f-market").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.market=b.dataset.m;render()});
  [["#f-type","type"],["#f-period","period"],["#f-h","h"],["#f-group","group"],["#f-fam","fam"]].forEach(([id,k])=>{const e=$(id);e.value=String(S[k]);e.onchange=()=>{S[k]=k==="h"?+e.value:e.value;render()}});
  $("#theme").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";render()};
  let t;addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(render,150)});
  render();
}
init();
</script>
